<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steampunk Platformer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #12100e;
      }
      /*
        The parent needs computed dimensions or ScaleManager centering silently misbehaves.
        Deliberately no rule targets `canvas`: the ScaleManager owns canvas.style
        (width/height/margin/image-rendering). A second writer here is the exact mechanism
        behind vault 1.5's "CSS silently contradicted the engine on every phone".

        🔴 THE CANVAS IS CENTRED ONCE, BY PHASER, AND THIS RULE MUST NOT CENTRE IT AGAIN.
        `display:flex; align-items:center; justify-content:center` used to live here while
        config.ts sets `autoCenter: Phaser.Scale.CENTER_BOTH`. Phaser's centring writes CSS
        MARGINS onto the canvas; a flex parent then centres the margin BOX, and the two compose
        to park the canvas roughly a quarter of the leftover gap off centre (vault 6.6/6.7,
        criterion 6.7). It looks almost right, which is why it survived five phases.

        The same comment above already said the ScaleManager owns canvas.style. Flex centring
        was a second writer of exactly that, and the comment did not stop it — a comment is not
        enforcement (vault C9). `tests/e2e/phase-06-hud.spec.ts` measures the canvas bounding
        box against the viewport instead, because only a measurement can.
      */
      /*
        🔴 `100vw` / `100vh` was a SCROLLBAR TRAP, and it clipped the game at every 16:9 viewport.
        Measured 2026-08-25 on the shipped page: at 1920x1080 the document scrolled 1920x1084 in a
        1905x1065 client area — both scrollbars, always — so the bottom and right 15 px of the canvas
        sat behind them until the player scrolled. At 2000x900 it also broke the CENTRING criterion
        6.7 asserts: 200 px of gap on the left against 185 on the right, because the canvas is
        centred inside a box that is itself 15 px wider than the visible area.

        Two causes, one rule:
          - `100vw` is the viewport INCLUDING the scrollbar gutter, so any vertical scrollbar makes
            the div wider than the client area, which creates a horizontal scrollbar, which shortens
            the client area. `100%` resolves against the parent's content box and cannot loop.
          - A `<canvas>` is `display: inline`, so its line box adds ~4 px of descender room below it.
            That is what produced the first scrollbar whenever FIT filled the height exactly — which
            is why the non-16:9 viewports in criterion 6.7 never saw it and 1400x900 measured clean.

        `overflow: hidden` absorbs that descender WITHOUT a `canvas` rule. The comment above is not
        being violated: the ScaleManager still owns every canvas property.

        Found by the play-owned capture round, by looking at a screenshot — not by a gate. Gated
        afterwards in `tests/e2e/phase-06-viewport.spec.ts` (a NEW spec, written for this).
        The first version of this comment named `phase-06-chrome.spec.ts`, which is the spec that
        MISSED the defect — both its viewports are deliberately non-16:9 and it measured centring
        inside the overflowing box. Two review briefs caught the wrong pointer.
      */
      /*
        Phase 12. Four touch rules, and NONE of them targets `canvas` or sets geometry, so the two
        invariants above still hold: the ScaleManager owns every canvas property, and the canvas is
        centred exactly once.

          - `touch-action: none` — without it the browser claims the gesture first. A thumb dragging
            on the LEFT button pans or pinch-zooms the page, and the pointer events the game needs
            are cancelled mid-drag. This is criterion 12.13.
          - `overscroll-behavior: none` — kills pull-to-refresh, which a downward thumb flick from
            the top of the screen triggers and which reloads the game mid-level.
          - `user-select: none` — a long press on the canvas otherwise raises the text-selection
            handles over the controls.
          - `-webkit-tap-highlight-color: transparent` — removes the grey flash iOS paints over a
            tapped element, which would strobe on every jump.

        Deliberately NOT here: `user-scalable=no` on the viewport meta. Disabling zoom outright is
        an accessibility anti-pattern (ux-guidelines.csv, Layout/'Disable zoom'), and `touch-action`
        already stops pinch inside the game without taking it away from the rest of the page.
      */
      html,
      body,
      #game {
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /*
        Phase 12, second repair. THE ROTATE OVERLAY IS DOM, NOT A PHASER OBJECT — and that is the
        fix, not a preference.

        It was two Phaser `Text` objects sized in CSS pixels (`18 / scale`) and positioned in GAME
        pixels (a fixed +/-48 px either side of centre). Those two units do not move together: at
        phone portrait the copy renders at 89 and 138 game px while its offsets stay at 48, so the
        lines were BOTH clipped at the sides and overlapping each other. The owner reported the
        clipping, a word-wrap fix turned it into an overlap, and the owner reported that too.

        A browser does not need to be told any of this. `flex` + `gap` + `padding` + a `max-width`
        lay two lines of real CSS text out correctly at every viewport that exists, and text that
        is too long simply wraps. The sibling project at C:\Claude\Street-Fighter has always done
        it this way and its rotate gate works on the owner's device.

        `#rotate` lives INSIDE `#game` so that a future fullscreen target of `game` keeps the
        overlay in the fullscreen subtree — the trap Street-Fighter's index.html documents. It is
        `position: fixed` and above the canvas, and `html.rotate` is written by `rotatePrompt.ts`
        from the one predicate the controls and the tap routes also ask.
      */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: #12100e;
        color: #f7e3b8;
        font-family: monospace;
        text-align: center;
      }
      html.rotate #rotate {
        display: flex;
      }
      #rotate .glyph {
        font-size: 64px;
        line-height: 1;
        color: #c8862b;
      }
      #rotate .title {
        font-size: 22px;
        letter-spacing: 2px;
      }
      #rotate .sub {
        font-size: 14px;
        color: #b9a07a;
        max-width: 30ch;
      }
      /*
        🔴 The second subline is the AFFORDANCE, and without it the fix is invisible.

        The owner's phone reports a landscape viewport of 798x283 -- Brave keeps its address bar --
        which letterboxes to a 503 px canvas, a CSS scale of 0.262, and controls at 41.9 px against
        the 44 px floor. So this overlay is up IN LANDSCAPE, correctly, and for four device sessions
        that read as a rotation the game never noticed. Fullscreen removes the chrome and the same
        device measures 53.3 px. `src/game/fullscreenOnTap.ts` listens on `#game`, which is the
        wrapper this overlay lives inside, so a tap on these words is what asks for it.
      */
      /*
        The overlay reports the numbers it decided from. Four device sessions have now ended with
        "it still does not clear", and every repair between them was written from arithmetic that
        measures correct on every viewport a phone can report - so the wrong thing is the input,
        not the sum. Digits only, no prose: `verify-dist.mjs` sweeps shipped text for dev wording.
      */
      #rotate .diag {
        font-size: 11px;
        color: #6f6250;
        letter-spacing: 1px;
      }

    </style>
  </head>
  <body>
    <div id="game">
      <div id="rotate" aria-live="polite">
        <div class="glyph">&#8635;</div>
        <div class="title">ROTATE YOUR DEVICE</div>
        <div class="sub">the controls need a landscape screen</div>
        <div class="sub">already landscape? tap for fullscreen</div>
        <div class="diag" id="rotate-diag"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
